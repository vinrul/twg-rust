[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.22"
bcrypt = "0.17"
bevy = { version = "0.20.1", features = ["http", "https", "jpeg", "web_asset_cache", "webp"] }
bevy_egui = "0.43.1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
infer = "0.19"
js-sys = "0.3"
rand = "0.8"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = "3.3"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Event",
    "Headers",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "WebSocket",
    "Window",
] }

twg-auth = { path = "crates/twg-auth" }
twg-client = { path = "crates/twg-client" }
twg-contracts = { path = "crates/twg-contracts" }
twg-domain = { path = "crates/twg-domain" }
twg-gltf-draco = { path = "crates/twg-gltf-draco" }
twg-map = { path = "crates/twg-map" }
twg-render = { path = "crates/twg-render" }
twg-server = { path = "crates/twg-server" }
twg-storage = { path = "crates/twg-storage" }
twg-ui = { path = "crates/twg-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = true
